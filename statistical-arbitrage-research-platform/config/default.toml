schema_version = "1.0.0"
run_name = "default_walkforward_demo"
seed = 42

[data]
prices_path = "data/fixtures/synthetic_universe_prices.parquet"
borrow_path = "data/fixtures/synthetic_universe_borrow.parquet"
use_log_prices = true
max_missing_fraction = 0.02
missing_price_policy = "raise"

[universe]
min_price = 5.0
min_adv_usd = 1000000.0
min_history_days = 120
require_active = true
same_sector_only = true

[selection]
method = "engle_granger"
hedge_ratio_estimator = "ols"
max_adf_pvalue = 0.05
fdr_alpha = 0.10
multiple_testing_method = "bh"
min_half_life_days = 2.0
max_half_life_days = 40.0
min_correlation = 0.50
max_pairs_per_fold = 4
include_baskets = true
basket_size = 3
max_baskets_per_fold = 1

[signals]
z_entry = 1.75
z_exit = 0.25
z_stop = 3.50
max_holding_days = 30
zscore_mode = "training_frozen"
zscore_lookback_days = 60

[execution]
initial_capital = 1000000.0
gross_leverage_target = 1.0
max_pair_weight = 0.35
commission_bps = 1.5
slippage_bps = 3.0
default_borrow_fee_bps_annual = 50.0
enforce_borrow_availability = true
strict_borrow_errors = false
recall_on_borrow_loss = true
execution_delay_days = 1

[walk_forward]
train_window_days = 180
test_window_days = 60
step_days = 60
embargo_days = 1
window_type = "rolling"

[evaluation]
annualization_days = 252
bootstrap_samples = 500
bootstrap_block_size = 10
confidence_level = 0.95
risk_free_rate_annual = 0.0
sweep_z_entries = [1.5, 1.75, 2.0, 2.25]

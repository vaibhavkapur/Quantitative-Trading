[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-attribution-engine"
version = "0.1.0"
description = "Reconciled portfolio return, strategy/instrument/sector contribution, Brinson & risk-factor attribution, execution-cost (TCA) attribution, and versioned report API."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
analytics = ["polars>=1.0", "numpy>=1.24"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.4"]

[project.scripts]
pae-server = "pae.api.http_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

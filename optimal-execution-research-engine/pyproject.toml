[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-execution-research-engine"
version = "0.1.0"
description = "Optimal execution research prototype comparing TWAP, VWAP, participation, and Almgren-Chriss schedules under spread, impact, capacity, and timing-risk assumptions."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24,<2.1",
    "scipy>=1.10,<1.14",
    "polars>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
]

[project.scripts]
optimal-execution = "optimal_execution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-factor-asset-pricing-engine"
version = "0.1.0"
description = "Educational and research prototype for estimating factor premia and evaluating cross-sectional asset-pricing models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Trading-Quantitative Contributors" }
]
dependencies = [
    "numpy>=1.24,<2.1",
    "polars>=1.0,<2.0",
    "statsmodels>=0.14,<0.15",
    "scipy>=1.10,<1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
mfape = "mfape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

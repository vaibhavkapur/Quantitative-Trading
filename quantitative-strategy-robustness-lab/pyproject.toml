[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-strategy-robustness-lab"
version = "0.1.0"
description = "Offline statistical robustness evaluation, multiple-testing diagnostics, and immutable experiment registry for quantitative trading strategies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quantitative Strategy Robustness Lab Contributors" }
]
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "pandas>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
robustness-lab = "robustness_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
